name: Lint add-on

on:
  push:
    paths:
      - 'silero-tts/**'
      - 'repository.yaml'
  pull_request:
    paths:
      - 'silero-tts/**'
      - 'repository.yaml'

jobs:
  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./silero-tts
