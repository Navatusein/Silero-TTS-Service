name: Release Docker

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: navatusein/silero-tts-service
  GHCR_IMAGE: ghcr.io/navatusein/silero-tts-service

jobs:
  check_version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Check that tag matches app and add-on versions
        run: |
          app_version=$(sed -n "s/^version = '\(.*\)'$/\1/p" app/config.py)
          addon_version=$(sed -n 's/^version: "\(.*\)"$/\1/p' silero-tts/config.yaml)
          if [ "$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version '$app_version' in app/config.py"
            exit 1
          fi
          if [ "$addon_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version '$addon_version' in silero-tts/config.yaml"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: check_version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            hass_arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            hass_arch: aarch64
    steps:
      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          labels: |
            io.hass.type=addon
            io.hass.version=${{ github.ref_name }}
            io.hass.arch=${{ matrix.hass_arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-platform tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            tags=$(jq -cr --arg image "$image" '.tags | map(select(startswith($image + ":")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)
          done

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
          docker buildx imagetools inspect "$GHCR_IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  release:
    name: Create draft release
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi

          cat > notes.md << EOF
          ## Docker

          Images are available for \`linux/amd64\` and \`linux/arm64\`.

          \`\`\`
          docker pull $DOCKERHUB_IMAGE:$GITHUB_REF_NAME
          docker pull $GHCR_IMAGE:$GITHUB_REF_NAME
          \`\`\`

          EOF

          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
