name: Silero TTS
version: "3.0.1"
slug: silero_tts
description: Offline Russian and Ukrainian speech synthesis based on Silero models (MaryTTS compatible API)
url: https://github.com/Navatusein/Silero-TTS-Service
image: navatusein/silero-tts-service
arch:
  - amd64
  - aarch64
startup: services
ports:
  9898/tcp: 9898
ports_description:
  9898/tcp: MaryTTS compatible HTTP API
environment:
  MODELS_DIRECTORY: /data/models
options:
  language: ru
  number_of_threads: 4
  sample_rate: 48000
  ha_fix: false
  voice_tts_errors: false
schema:
  language: list(ru|uk|multi)
  number_of_threads: int(1,)
  sample_rate: list(8000|24000|48000)
  sox_param: str?
  ha_fix: bool
  voice_tts_errors: bool
